# Cloudflare Origin CA wildcard cert (*.smsperkasa.com + smsperkasa.com, valid to 2041),
# bind-mounted read-only from the host at /etc/ssl/cloudflare (see docker-compose.smsp-prod.yaml).
# Required for Cloudflare Full (Strict): the previous baked-in cert was self-signed, expired
# (2023-01-24), and only covered dev.smsperkasa.com — it would 526 under Full (Strict).
ssl_certificate     /etc/ssl/cloudflare/smsperkasa.com.pem;
ssl_certificate_key /etc/ssl/cloudflare/smsperkasa.com.key;